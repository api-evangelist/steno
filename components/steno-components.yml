note: Steno ships no JavaScript element library or web-component SDK. What it does
  ship are host-platform embedded surfaces — a Lightning Web Component installed into
  Salesforce/Litify, a Zoom App panel, and a Clio Manage in-app booking surface. Those
  are the real embeddable components and they are recorded here. None is loadable from
  a public CDN; each is installed through its host platform's marketplace.
