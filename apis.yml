aid: steno
name: Steno
description: 'Steno is a Los Angeles-based legal technology and litigation services
  company serving more than 1,200 US law firms with court reporting, remote and hybrid
  depositions, legal videography, interpreting, and record retrieval. Its software
  products are Steno Connect for Zoom (a videoconferencing and exhibit-handling app
  purpose-built for remote depositions, hearings, and bench trials), Firm Dashboard
  (scheduling, job management, file access, invoicing, SAML SSO, MFA, and role-based
  access control), Transcript Genius (AI-assisted transcript search, summarization,
  and video clip cutting), and DelayPay deferred-payment financing for plaintiff firms.
  Steno does not operate a public developer program: its integration surface is distributed
  through host platforms as a Salesforce AppExchange managed package for Litify, a
  Clio App Directory listing for Clio Manage, and a Zoom Marketplace app, each authenticated
  with an organization-scoped API key that Steno issues on request. Steno Connect,
  Firm Dashboard, and Ops are audited SOC 2 Type II and HIPAA by Linford & Company
  LLP, with posture published at a Vanta-hosted trust center.'
